name: Tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ".[dev,llm,experiment]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q
      - run: bar validate --graph tests/fixtures/tiny_evidence_graph.json
      - run: bar smoke --config configs/bar_default.json
      - run: bar demo --no-open
