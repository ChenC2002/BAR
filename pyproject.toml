[project]
name = "bar-paper-code"
version = "2.0.0"
description = "Core algorithms for budget-aware reasoning over medical knowledge graphs."
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "numpy>=1.26,<3", "pydantic>=2.10,<3", "networkx>=3.4,<4"]

[project.optional-dependencies]
llm = ["openai>=1.60,<3"]
dev = ["pytest>=8,<10", "ruff>=0.9"]
experiment = ["scikit-learn>=1.5,<2"]

[project.scripts]
bar = "bar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.data-files]
"share/bar/demo" = ["demo/index.html", "demo/styles.css", "demo/app.js", "demo/data.js"]
"share/bar/demo/vendor" = ["demo/vendor/lucide.min.js", "demo/vendor/lucide-LICENSE"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
