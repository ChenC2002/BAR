[project]
name = "bar-paper-code"
version = "2.0.0"
description = "Core algorithms for budget-aware reasoning over medical knowledge graphs."
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "numpy>=1.26,<3", "pydantic>=2.10,<3", "networkx>=3.4,<4"]

[project.optional-dependencies]
llm = ["openai>=1.60,<3"]
dev = ["pytest>=8,<10", "ruff>=0.9", "build>=1.2,<2"]
experiment = ["scikit-learn>=1.5,<2"]

[project.scripts]
bar = "bar.cli:main"

[tool.setuptools]
packages = ["bar", "bar.data", "bar._demo"]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"
"bar._demo" = "demo"

[tool.setuptools.package-data]
"bar._demo" = ["*.html", "*.css", "*.js", "vendor/*.js", "vendor/*LICENSE"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
